<svg xmlns="http://www.w3.org/2000/svg" width="760" height="664" viewBox="0 0 760 664" role="img" aria-labelledby="title desc"><title id="title">몽글마을의 기획 포지셔닝</title><desc id="desc">가로축은 자기관리 기능, 세로축은 정서적 연결이다. 제공 발표 자료의 상대적 배치를 재구성해 MS To Do, TickTick, Notion, gogh, Habitica, Cram and Conquer와 몽글마을의 목표 위치를 표시한다. 좌표는 측정값이 아니다.</desc><rect width="760" height="664" rx="24" fill="#FFF8E7"/><g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="36" y="42" font-size="14" fill="#8A9026" font-weight="700" text-anchor="start">POSITIONING · 기획 당시의 정성적 비교</text><text x="36" y="84" font-size="29" fill="#60442E" font-weight="700" text-anchor="start">자기관리와 정서적 연결을 함께</text><rect x="30" y="112" width="700" height="440" rx="18" fill="#FFFDF7" stroke="#E8D7B4"/><rect x="390" y="150" width="308" height="185" rx="18" fill="#F5ECD4"/><path d="M64 350H701M380 526V137" fill="none" stroke="#CEBC94" stroke-width="1.5"/><text x="380" y="132" font-size="16" fill="#60442E" font-weight="700" text-anchor="middle">정서적 연결 강함 ↑</text><text x="48" y="376" font-size="15" fill="#60442E" font-weight="400" text-anchor="start">← 자기관리 약함</text><text x="710" y="376" font-size="15" fill="#60442E" font-weight="400" text-anchor="end">자기관리 강함 →</text><text x="380" y="537" font-size="15" fill="#60442E" font-weight="400" text-anchor="middle">정서적 연결 약함 ↓</text><circle cx="145" cy="460" r="7" fill="#939A23"/><text x="158" y="466" font-size="17" fill="#60442E" font-weight="600" text-anchor="start">MS To Do</text><circle cx="452" cy="448" r="7" fill="#939A23"/><text x="465" y="454" font-size="17" fill="#60442E" font-weight="600" text-anchor="start">TickTick</text><circle cx="585" cy="407" r="7" fill="#939A23"/><text x="598" y="413" font-size="17" fill="#60442E" font-weight="600" text-anchor="start">Notion</text><circle cx="171" cy="286" r="7" fill="#939A23"/><text x="184" y="292" font-size="17" fill="#60442E" font-weight="600" text-anchor="start">gogh</text><circle cx="245" cy="239" r="7" fill="#939A23"/><text x="258" y="245" font-size="17" fill="#60442E" font-weight="600" text-anchor="start">Habitica</text><circle cx="338" cy="195" r="7" fill="#939A23"/><text x="351" y="201" font-size="17" fill="#60442E" font-weight="600" text-anchor="start">Cram &amp; Conquer</text><circle cx="575" cy="202" r="12" fill="#CC704A"/><text x="575" y="239" font-size="24" fill="#BD633D" font-weight="700" text-anchor="middle">몽글마을</text><text x="575" y="265" font-size="16" fill="#60442E" font-weight="400" text-anchor="middle">자기관리 + 정서적 연결</text><text x="575" y="291" font-size="14" fill="#89633D" font-weight="400" text-anchor="middle">제품이 지향하는 위치</text><text x="36" y="590" font-size="20" fill="#60442E" font-weight="700" text-anchor="start">생산성 앱의 루틴 관리 수요 × 성인 키덜트의 애착 사물 경험</text><text x="36" y="620" font-size="14" fill="#60442E" font-weight="400" text-anchor="start">제공된 발표 자료의 상대 배치를 재구성했습니다. 좌표는 정량 점수가 아닙니다.</text><text x="36" y="642" font-size="14" fill="#60442E" font-weight="400" text-anchor="start">몽글마을의 목표 위치를 나타내며, 경쟁 서비스 대비 우위를 입증한 결과가 아닙니다.</text></g></svg>