<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" role="img" aria-labelledby="title desc"><title id="title">수요에서 포지셔닝까지: 몽글마을의 기획 논리</title><desc id="desc">자기개발과 기록·루틴 수요, 20~30대 여성이라는 핵심 기획 대상, 30일 리텐션 9.63%의 지속 문제, 정서적 애착과 동기에 대한 가설, 세 경쟁 유형 분석을 거쳐 생산성 앱과 성인 키덜트 시장의 교차점을 목표로 한다.</desc><rect width="760" height="1030" rx="24" fill="#FFF8E7"/><g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="36" y="42" font-size="14" fill="#8A9026" font-weight="700" text-anchor="start">MONGLE VILLAGE · 기획 배경</text><text x="36" y="84" font-size="30" fill="#60442E" font-weight="700" text-anchor="start">왜 몽글마을을 기획했을까?</text><rect x="28" y="114" width="704" height="152" rx="18" fill="#FFFDF7" stroke="#E8D7B4"/><rect x="46" y="132" width="44" height="38" rx="12" fill="#969C24"/><text x="68" y="158" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">01</text><text x="106" y="157" font-size="22" fill="#60442E" font-weight="700" text-anchor="start">꾸준한 기록과 루틴을 찾는 수요</text><text x="106" y="188" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">직장인 자기개발 71.2% · 기록·루틴 앱 성장 사례</text><text x="106" y="213" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">여성 55.8% / 20~30대 55.0%의 이용자 구성에 주목</text><text x="106" y="238" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">핵심 기획 대상: 자기관리에 관심 있는 20~30대 여성</text><path d="M380 271v15m-5-5 5 5 5-5" fill="none" stroke="#B3A17A" stroke-width="2"/><rect x="28" y="292" width="704" height="116" rx="18" fill="#FFFDF7" stroke="#E8D7B4"/><rect x="46" y="310" width="44" height="38" rx="12" fill="#969C24"/><text x="68" y="336" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">02</text><text x="106" y="335" font-size="22" fill="#60442E" font-weight="700" text-anchor="start">그러나, 관심이 지속으로 이어지지는 않는다</text><text x="106" y="366" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">생산성 앱 1일 리텐션 32.86% → 30일 9.63%</text><text x="106" y="391" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">기획 과제: 계획을 세운 뒤에도 다시 돌아올 이유 만들기</text><path d="M380 413v15m-5-5 5 5 5-5" fill="none" stroke="#B3A17A" stroke-width="2"/><rect x="28" y="434" width="704" height="146" rx="18" fill="#FFFDF7" stroke="#E8D7B4"/><rect x="46" y="452" width="44" height="38" rx="12" fill="#969C24"/><text x="68" y="478" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">03</text><text x="106" y="477" font-size="22" fill="#60442E" font-weight="700" text-anchor="start">팀이 세운 이탈 원인 가설</text><text x="106" y="508" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">완료 경험이 단순한 체크 표시에서 끝남</text><text x="106" y="533" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">→ 서비스에 대한 정서적 애착이 쌓이기 어려움</text><text x="106" y="558" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">→ 다시 방문해 루틴을 이어갈 동기가 약해질 수 있음</text><path d="M380 585v15m-5-5 5 5 5-5" fill="none" stroke="#B3A17A" stroke-width="2"/><rect x="28" y="606" width="704" height="126" rx="18" fill="#FFFDF7" stroke="#E8D7B4"/><rect x="46" y="624" width="44" height="38" rx="12" fill="#969C24"/><text x="68" y="650" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">04</text><text x="106" y="649" font-size="22" fill="#60442E" font-weight="700" text-anchor="start">경쟁 서비스에서 찾은 세 가지 접근</text><text x="106" y="680" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">일정 관리  ·  개인화  ·  게이미피케이션</text><text x="106" y="705" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">비교 질문: 자기관리와 정서적 연결을 함께 강화할 수 있을까?</text><path d="M380 737v15m-5-5 5 5 5-5" fill="none" stroke="#B3A17A" stroke-width="2"/><rect x="28" y="758" width="704" height="148" rx="18" fill="#F3F0CB" stroke="#E8D7B4"/><rect x="46" y="776" width="44" height="38" rx="12" fill="#969C24"/><text x="68" y="802" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">05</text><text x="106" y="801" font-size="22" fill="#60442E" font-weight="700" text-anchor="start">생산성 앱 × 성인 키덜트 시장</text><text x="106" y="832" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">기록·루틴 관리의 실용성 + 애착 인형의 정서적 의미</text><text x="106" y="857" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">몽글마을: 자기관리도, 정서적 연결도 강한 경험</text><text x="106" y="882" font-size="17" fill="#60442E" font-weight="400" text-anchor="start">TODO·일정 → 주민 퀘스트 → 보상·주민 피드</text><text x="36" y="946" font-size="13" fill="#60442E" font-weight="400" text-anchor="start">수치: 잡플래닛(2024) · 코리안클릭(2023.05~2024.04) · OneSignal(2024)</text><text x="36" y="968" font-size="13" fill="#60442E" font-weight="400" text-anchor="start">성별·연령은 별개 분포입니다. 앱 성장 사례는 제공된 발표 자료의 인용입니다.</text><text x="36" y="990" font-size="13" fill="#60442E" font-weight="400" text-anchor="start">03은 검증할 제품 가설이며, 05는 기획 목표입니다. 출처와 조건은 본문에 연결했습니다.</text></g></svg>