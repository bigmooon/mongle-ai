<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title desc">
  <title id="title">몽글마을: 시작은 가볍게, 실천은 함께</title>
  <desc id="desc">기획서의 세 가지 문제의식과 제품 접근. 목표가 막막할 때는 대화로 할 일을 구체화하고, 혼자 이어가기 어려울 때는 애착 인형을 나만의 주민으로 만들며, 작은 성취를 남기고 싶을 때는 퀘스트 완료를 사과 보상과 주민 피드로 기록한다. 기대효과는 사용자 지표로 검증할 제품 가설이다.</desc>
  <rect width="760" height="740" rx="24" fill="#F8F5EE"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <text x="40" y="45" font-size="13" font-weight="700" letter-spacing="2" fill="#637957">MONGLE VILLAGE · PRODUCT IDEA</text>
    <text x="40" y="92" font-size="32" font-weight="700" fill="#28392D">시작은 가볍게, 실천은 함께</text>
    <text x="40" y="122" font-size="17" fill="#626A60">자기관리의 시작과 지속을 돕기 위한 세 가지 접근</text>

    <rect x="32" y="154" width="696" height="150" rx="18" fill="#FFFFFF" stroke="#DDDCD1"/>
    <rect x="52" y="174" width="48" height="48" rx="14" fill="#EAF0E2"/>
    <text x="76" y="206" text-anchor="middle" font-size="23" font-weight="700" fill="#4E6846">01</text>
    <text x="120" y="195" font-size="15" fill="#70776B">목표가 막막할 때</text>
    <text x="120" y="228" font-size="25" font-weight="700" fill="#28392D">대화로 오늘 할 일을 구체화</text>
    <text x="120" y="258" font-size="17" fill="#505B50">자연어 목표 → AI 플래너와 구체화 → TODO 확인·저장</text>
    <text x="120" y="283" font-size="15" fill="#70776B">무엇부터 시작할지 정하는 부담을 덜고자 합니다.</text>

    <rect x="32" y="320" width="696" height="150" rx="18" fill="#FFFFFF" stroke="#DDDCD1"/>
    <rect x="52" y="340" width="48" height="48" rx="14" fill="#F8E7DE"/>
    <text x="76" y="372" text-anchor="middle" font-size="23" font-weight="700" fill="#996747">02</text>
    <text x="120" y="361" font-size="15" fill="#70776B">혼자 이어가기 어려울 때</text>
    <text x="120" y="394" font-size="25" font-weight="700" fill="#28392D">내 애착 인형이 나만의 주민으로</text>
    <text x="120" y="424" font-size="17" fill="#505B50">인형 사진·설명 → AI 주민 생성 → 마을 입주</text>
    <text x="120" y="449" font-size="15" fill="#70776B">나에게 의미 있는 캐릭터와 일상을 함께하도록 설계했습니다.</text>

    <rect x="32" y="486" width="696" height="150" rx="18" fill="#FFFFFF" stroke="#DDDCD1"/>
    <rect x="52" y="506" width="48" height="48" rx="14" fill="#E5EAF5"/>
    <text x="76" y="538" text-anchor="middle" font-size="23" font-weight="700" fill="#566D92">03</text>
    <text x="120" y="527" font-size="15" fill="#70776B">작은 성취를 남기고 싶을 때</text>
    <text x="120" y="560" font-size="25" font-weight="700" fill="#28392D">실천을 보상과 주민 피드로 기록</text>
    <text x="120" y="590" font-size="17" fill="#505B50">퀘스트와 연결된 TODO 완료 → 사과 보상·이미지·글</text>
    <text x="120" y="615" font-size="15" fill="#70776B">할 일의 완료가 눈에 보이는 기록으로 남도록 연결했습니다.</text>

    <text x="40" y="680" font-size="18" font-weight="700" fill="#40573C">지향점 · 다시 찾아오고 싶은 자기관리 경험</text>
    <text x="40" y="709" font-size="14" fill="#70776B">프로젝트 기획서의 제품 가설을 재구성했습니다. 효과는 사용자 지표로 검증할 과제입니다.</text>
  </g>
</svg>
